<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <article class="article">
      <img class="article__preview" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix working principle screenshot">
      <a class="article__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </article>
    <main class="main">
      <section class="section">
        <h2 class="section__heading section__heading_moved">Add Item</h2>
        <form class="form">
          <input class="form__input" type="text">
          <button class="button form__confirm" type="button">Add</button>
        </form>
      </section>
      <section class="section">
        <h2 class="section__heading">Todo</h2>
        <ul class="list">
          <li class="task task_active">
            <input class="task__check" type="checkbox">
            <p class="task__name">Pay Bills</p>
            <input class="task__input" type="text">
            <button class="button task__edit">Edit</button>
            <button class="button task__delete">
              <img class="icon" src="./remove.svg" alt="Remove task icon">
            </button>
          </li>
          <li class="task task_active task_mode_editing">
            <input class="task__check" type="checkbox">
            <p class="task__name">Go Shopping</p>
            <input class="task__input" type="text" value="Go Shopping">
            <button class="button task__edit">Save</button>
            <button class="button task__delete">
              <img class="icon" src="./remove.svg" alt="Remove task icon">
            </button>
          </li>
        </ul>
      </section>
      <section class="section">
        <h2 class="section__heading">Completed</h2>
        <ul class="list">
          <li class="task task_completed">
            <input class="task__check" type="checkbox" checked>
            <p class="task__name">See the Doctor</p>
            <input class="task__input" type="text">
            <button class="button task__edit">Edit</button>
            <button class="button task__delete">
              <img class="icon" src="./remove.svg" alt="Remove task icon">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
